<title>등번호 메모리</title>
<style>
  :root {
    /* 울산 HD 구단 컬러 — 단일 테마로 확정, 전부 명시 */
    --ink:    #041A45;  /* 딥 네이비 바탕 */
    --board:  #062B6B;  /* 구단 블루 */
    --panel:  #0B3A8C;  /* 로열 블루 */
    --line:   #1D4CA1;
    --chalk:  #F2F6FF;
    --muted:  #8FAEDC;
    --gold:   #FFD200;  /* 구단 옐로우 */
    --gold-d: #E8B400;
    --good:   #3FBF6E;
    --bad:    #FF4A3D;

    --block: Impact, Haettenschweiler, "Franklin Gothic Bold", "Arial Black", sans-serif;
    --mono:  ui-monospace, "SF Mono", Consolas, "DejaVu Sans Mono", monospace;
    --ui:    "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;

    /* 전광판과 보드가 공유하는 단일 폭.
       6열 3행이 세로로도 들어가야 하므로 화면 높이로도 폭을 제한한다.
       (카드 비율 0.78, gap 8px 기준: 보드 높이 ≈ 0.641 × (폭 - 40) + 16) */
    --frame: min(680px, 94vw, calc((100svh - 216px) * 1.56 + 15px));
  }

  body {
    margin: 0;
    min-height: 100svh;
    background:
      radial-gradient(120% 70% at 50% -10%, #0B3A8C 0%, transparent 62%),
      var(--ink);
    color: var(--chalk);
    font-family: var(--ui);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px 16px 28px;
    box-sizing: border-box;
  }

  /* ---------- 전광판 ---------- */

  .scoreboard {
    width: var(--frame);
    box-sizing: border-box;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 14px;
    border: 1px solid var(--line);
    border-bottom: 2px solid var(--gold);  /* 킷 트림 */
    border-radius: 4px;
    background: linear-gradient(180deg, var(--panel), var(--board));
    padding: 14px 18px 12px;
    box-shadow: 0 18px 40px -22px #000;
  }

  .eyebrow {
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 4px;
  }
  .eyebrow b { color: var(--gold); font-weight: 700; }

  h1 {
    font-family: var(--block);
    font-weight: 400;
    font-size: 30px;
    letter-spacing: .02em;
    line-height: 1;
    margin: 0 0 8px;
    text-wrap: balance;
  }

  .status {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
    min-height: 1.3em;
  }
  .status strong { color: var(--chalk); font-weight: 600; }

  .clock { text-align: right; }

  .timer {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 40px;
    line-height: .95;
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 18px #ffd2004d;
  }
  .timer.urgent { color: var(--bad); text-shadow: 0 0 18px #ff4a3d55; }
  .timer .unit { font-size: 14px; color: var(--muted); text-shadow: none; margin-left: 2px; }

  .bar {
    width: 132px;
    height: 4px;
    margin-top: 8px;
    background: #031236;
    border-radius: 2px;
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 100%;
    background: var(--gold);
    transform-origin: right center;
  }
  .timer.urgent ~ .bar > i { background: var(--bad); }

  .pips {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    justify-content: flex-end;
  }
  .pip {
    width: 22px;
    height: 6px;
    border-radius: 1px;
    background: #031236;
    border: 1px solid var(--line);
  }
  .pip.on {
    background: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 0 10px #ffd20066;
  }

  /* ---------- 보드 ---------- */

  .stage { position: relative; }

  .board {
    width: var(--frame);
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .card {
    all: unset;
    box-sizing: border-box;
    aspect-ratio: 0.78;
    perspective: 700px;
    cursor: pointer;
    border-radius: 5px;
  }
  .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .card[disabled] { cursor: default; }

  .inner {
    display: block; /* span 기본값 inline 이면 width/height 가 먹지 않아 0x0 으로 붕괴한다 */
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .38s cubic-bezier(.3,.8,.3,1);
  }
  .card.up .inner { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 5px;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* 뒷면 — 구단 선수 카드의 찢어진 대각선 경계를 그대로 가져왔다 */
  .back { border: 1px solid var(--line); }
  .back svg { width: 100%; height: 100%; display: block; }

  .front {
    transform: rotateY(180deg);
    border: 1px solid #2C63C4;
  }

  /* 등번호 면 — 실제 킷대로 파란 바탕에 노란 번호 */
  .front.jersey-face {
    background: linear-gradient(170deg, var(--line), var(--panel));
  }
  .front.jersey-face svg { width: 100%; height: 100%; display: block; }
  .front.jersey-face .num {
    font-family: var(--block);
    font-size: 54px;
    fill: var(--gold);
    letter-spacing: .01em;
  }
  .jersey { fill: #ffffff12; stroke: #ffd20055; stroke-width: 1.5; }

  /* 얼굴 면 — 사진이 카드를 꽉 채운다 */
  .front.photo { background: var(--board); }
  .front.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card.matched .front {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold), 0 0 24px -4px #ffd20077;
  }
  .card.matched .front.jersey-face { background: linear-gradient(170deg, var(--gold), var(--gold-d)); }
  .card.matched .front.jersey-face .num { fill: var(--board); }
  .card.matched .front.jersey-face .jersey { fill: #00000010; stroke: #00000038; }

  .card.pop .inner { animation: pop .34s ease; }
  .card.wrong .inner { animation: shake .3s ease; }
  @keyframes pop { 50% { transform: rotateY(180deg) scale(1.09); } }
  @keyframes shake {
    25% { transform: rotateY(180deg) translateX(-4px); }
    75% { transform: rotateY(180deg) translateX(4px); }
  }

  .board.dealing .card .inner { animation: deal .3s backwards; }
  @keyframes deal { from { opacity: 0; transform: translateY(10px) rotateY(180deg); } }

  /* ---------- 오버레이 ---------- */

  .overlay {
    position: absolute;
    inset: -10px;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 14px;
    text-align: center;
    background: #041A45E6;
    backdrop-filter: blur(3px);
    border-radius: 8px;
    padding: 24px;
  }
  .overlay[hidden] { display: none; }

  .verdict {
    font-family: var(--block);
    font-size: 42px;
    line-height: 1;
    letter-spacing: .03em;
    margin: 0;
    color: var(--gold);
  }
  .verdict.win  { color: var(--good); }
  .verdict.lose { color: var(--bad); }

  .detail { margin: 0; color: var(--muted); font-size: 14px; max-width: 34ch; line-height: 1.6; }
  .detail b { color: var(--chalk); font-weight: 600; }

  button.action {
    all: unset;
    cursor: pointer;
    font-family: var(--ui);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--board);
    background: var(--gold);
    padding: 12px 26px;
    border-radius: 3px;
    transition: filter .15s;
  }
  button.action:hover { filter: brightness(1.08); }
  button.action:focus-visible { outline: 2px solid var(--chalk); outline-offset: 3px; }

  /* 좁은 화면은 3열 6행 — 세로가 더 필요하므로 폭을 더 조인다 */
  @media (max-width: 560px) {
    :root { --frame: min(94vw, calc((100svh - 200px) * 0.39 + 1px)); }
    .board { grid-template-columns: repeat(3, 1fr); }
    .scoreboard { padding: 10px 14px 9px; }
    h1 { font-size: 22px; }
    .status { font-size: 12px; }
    .timer { font-size: 30px; }
    .bar { width: 104px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .inner { transition-duration: .01ms; }
    .card.pop .inner, .card.wrong .inner, .board.dealing .card .inner { animation: none; }
  }
</style>

<div class="scoreboard">
  <div>
    <p class="eyebrow"><b>Ulsan HD FC</b> · Memory Match</p>
    <h1>얼굴 × 등번호 메모리</h1>
    <p class="status" id="status">선수 얼굴과 그 선수의 등번호를 짝지으세요.</p>
  </div>
  <div class="clock">
    <div class="timer" id="timer">10.0<span class="unit">초</span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="pips" id="pips"></div>
  </div>
</div>

<div class="stage">
  <div class="board" id="board"></div>
  <div class="overlay" id="overlay">

    <p class="detail" id="detail"></p>
    <button class="action" id="action">시작</button>
  </div>
</div>

  function shuffled() {
    const deck = [];
    for (const p of PLAYERS) deck.push({ p, photo: true }, { p, photo: false });
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    return deck;
  }

  function frontFace(c) {
    if (c.photo) {
      return '<span class="face front photo"><img src="' + c.p.img + '" alt=""/></span>';
    }
    return '<span class="face front jersey-face">' +
      '<svg viewBox="0 0 100 140" aria-hidden="true">' +
        '<path class="jersey" d="' + JERSEY + '"/>' +
        '<text class="num" x="50" y="95" text-anchor="middle">' + c.p.n + '</text>' +
      '</svg>' +
    '</span>';
  }

  function buildBoard() {
    boardEl.innerHTML = '';
    cards = shuffled().map((c, i) => {
      const el = document.createElement('button');
      el.className = 'card up';
      el.type = 'button';
      el.innerHTML =
        '<span class="inner">' +
          '<span class="face back">' + BACK + '</span>' +
          frontFace(c) +
        '</span>';
      el.firstElementChild.style.animationDelay = (i * 12) + 'ms';
      el.addEventListener('click', () => onPick(i));
      boardEl.appendChild(el);
      return { p: c.p, photo: c.photo, el, matched: false };
    });
    boardEl.classList.add('dealing');
    setTimeout(() => boardEl.classList.remove('dealing'), 700);
    syncLabels();
  }

  function syncLabels() {
    cards.forEach(c => {
      const open = c.el.classList.contains('up');
      const face = c.photo ? c.p.name + ' 선수 사진' : c.p.n + '번';
      c.el.setAttribute('aria-label', open ? face : '덮인 카드');
      c.el.disabled = phase !== 'play' || open;
    });
  }

  function buildPips() {
    pipsEl.innerHTML = '';
    for (let i = 0; i < TARGET_PAIRS; i++) {
      const p = document.createElement('span');
      p.className = 'pip';
      pipsEl.appendChild(p);
    }
  }

  function paintPips() {
    [...pipsEl.children].forEach((p, i) => p.classList.toggle('on', i < matchedPairs));
  }

  function renderClock(remaining, total) {
    timerEl.firstChild.nodeValue = (remaining / 1000).toFixed(1);
    timerEl.classList.toggle('urgent', phase === 'play' && remaining <= 3000);
    barEl.style.transform = 'scaleX(' + (remaining / total) + ')';
  }

  function countdown(total, onEnd) {
    const deadline = performance.now() + total;
    const tick = now => {
      const remaining = Math.max(0, deadline - now);
      renderClock(remaining, total);
      if (remaining <= 0) { rafId = null; onEnd(); return; }
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
  }

  function clearTimers() {
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    if (flipBackTimer !== null) { clearTimeout(flipBackTimer); flipBackTimer = null; }
  }

  function start() {
    clearTimers();
    picked = [];
    matchedPairs = 0;
    locked = false;
    overlayEl.hidden = true;
    buildPips();
    paintPips();

    phase = 'memorize';
    buildBoard();
    statusEl.innerHTML = '<strong>외우세요.</strong> 잠시 뒤 모든 카드가 덮입니다.';
    countdown(MEMORIZE_MS, beginPlay);
  }

  function beginPlay() {
    phase = 'play';
    cards.forEach(c => c.el.classList.remove('up'));
    syncLabels();
    statusEl.innerHTML = '얼굴과 등번호를 짝지어 <strong>' + TARGET_PAIRS + '세트</strong>를 맞추세요.';
    countdown(PLAY_MS, () => finish(false));
  }

  function onPick(i) {
    if (phase !== 'play' || locked) return;
    const card = cards[i];
    if (card.matched || card.el.classList.contains('up')) return;

    card.el.classList.add('up');
    syncLabels();
    picked.push(i);
    if (picked.length < 2) return;

    const [a, b] = picked.map(k => cards[k]);
    picked = [];

    if (a.p.n === b.p.n) {
      a.matched = b.matched = true;
      [a, b].forEach(c => {
        c.el.classList.add('matched', 'pop');
        setTimeout(() => c.el.classList.remove('pop'), 340);
      });
      matchedPairs++;
      paintPips();
      if (matchedPairs >= TARGET_PAIRS) finish(true);
      return;
    }

    locked = true;
    [a, b].forEach(c => c.el.classList.add('wrong'));
    syncLabels();
    flipBackTimer = setTimeout(() => {
      flipBackTimer = null;
      if (phase !== 'play') return;
      [a, b].forEach(c => c.el.classList.remove('up', 'wrong'));
      locked = false;
      syncLabels();
    }, MISMATCH_MS);
  }

  function finish(won) {
    phase = 'over';
    clearTimers();
    locked = false;
    syncLabels();
    cards.forEach(c => { if (!c.matched) c.el.classList.remove('up', 'wrong'); });

    verdictEl.textContent = won ? '성공' : '시간 종료';
    verdictEl.className = 'verdict ' + (won ? 'win' : 'lose');
    detailEl.innerHTML = won
      ? '제한 시간 안에 <b>' + TARGET_PAIRS + '세트</b>를 맞췄습니다.'
      : '<b>' + matchedPairs + ' / ' + TARGET_PAIRS + '세트</b>에서 멈췄습니다.';
    actionEl.textContent = '다시 하기';
    statusEl.innerHTML = won ? '<strong>깔끔한 마무리.</strong>' : '카드는 매번 새로 섞입니다.';
    if (!won) renderClock(0, PLAY_MS);
    overlayEl.hidden = false;
    actionEl.focus();
  }

  actionEl.addEventListener('click', start);

  // 첫 화면
  buildPips();
  buildBoard();
  cards.forEach(c => c.el.classList.remove('up'));
  phase = 'ready';
  syncLabels();
  renderClock(PLAY_MS, PLAY_MS);
  verdictEl.textContent = '킥오프';
  verdictEl.className = 'verdict';
  detailEl.innerHTML = '카드 <b>18장</b>을 <b>' + (MEMORIZE_MS / 1000) +
    '초</b> 동안 외운 뒤, <b>' + (PLAY_MS / 1000) + '초</b> 안에 얼굴–등번호 <b>' +
    TARGET_PAIRS + '세트</b>를 맞추면 성공입니다.';
</script>
